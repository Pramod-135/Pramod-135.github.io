<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maestro - My Profile</title>
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    .profile-wrapper {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #fdfaf5;
    }

    .profile-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(92, 64, 51, 0.12);
      padding: 50px 44px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Avatar circle with initials */
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #8b5a2b;
      color: white;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      letter-spacing: 1px;
    }

    .profile-name {
      font-size: 1.7rem;
      font-weight: 700;
      color: #5c4033;
      margin-bottom: 4px;
    }

    .profile-joined {
      font-size: 0.88rem;
      color: #aaa;
      margin-bottom: 32px;
    }

    /* Info rows */
    .info-list {
      text-align: left;
      border-top: 1px solid #f0e6dd;
      margin-top: 8px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid #f0e6dd;
    }

    .info-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff4ec;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon .material-symbols-outlined {
      font-size: 20px;
      color: #8b5a2b;
    }

    .info-text {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.78rem;
      color: #aaa;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 1rem;
      color: #444;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Buttons */
    .profile-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .profile-actions a {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-menu {
      background: #8b5a2b;
      color: white;
    }

    .btn-menu:hover {
      background: #6d4a22;
    }

    .btn-logout {
      background: white;
      color: #c0392b;
      border: 2px solid #e8d8cc;
    }

    .btn-logout:hover {
      border-color: #c0392b;
      background: #fff5f5;
    }

    /* Not logged in state */
    .not-logged-in {
      text-align: center;
      padding: 60px 30px;
    }

    .not-logged-in h2 {
      color: #5c4033;
      margin-bottom: 10px;
    }

    .not-logged-in p {
      color: #888;
      margin-bottom: 24px;
    }

    @media (max-width: 500px) {
      .profile-card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="container">
      <h1 class="cafe-name">Maestro</h1>
      <nav class="top-nav">
        <a href="home.html" title="Home">
          <span class="material-symbols-outlined">home</span>
          <span class="nav-label">Home</span>
        </a>
        <a href="menu.html" title="Menu">
          <span class="material-symbols-outlined">menu_book</span>
          <span class="nav-label">Menu</span>
        </a>
        <a href="about.html" title="About Us">
          <span class="material-symbols-outlined">info</span>
          <span class="nav-label">About</span>
        </a>
        <a href="profile.html" class="active" title="Profile">
          <span class="material-symbols-outlined">account_circle</span>
          <span class="nav-label">Profile</span>
        </a>
        <a href="cart.html" title="Cart">
          <span class="material-symbols-outlined">shopping_cart</span>
          <span class="nav-label">Cart</span>
        </a>
      </nav>
    </div>
  </header>

  <div class="profile-wrapper">

    <!-- Shown when user data exists -->
    <div class="profile-card" id="profile-card" style="display:none;">

      <div class="avatar" id="avatar-initials">??</div>
      <p class="profile-name" id="display-name">—</p>
      <p class="profile-joined" id="display-joined">Member since —</p>

      <div class="info-list">
        <div class="info-row">
          <div class="info-icon">
            <span class="material-symbols-outlined">person</span>
          </div>
          <div class="info-text">
            <span class="info-label">Full Name</span>
            <span class="info-value" id="info-name">—</span>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <span class="material-symbols-outlined">mail</span>
          </div>
          <div class="info-text">
            <span class="info-label">Email</span>
            <span class="info-value" id="info-email">—</span>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <span class="material-symbols-outlined">calendar_today</span>
          </div>
          <div class="info-text">
            <span class="info-label">Joined On</span>
            <span class="info-value" id="info-joined">—</span>
          </div>
        </div>
      </div>

      <div class="profile-actions">
        <a href="menu.html" class="btn-menu">Browse Menu</a>
        <a href="#" class="btn-logout" id="logout-btn">Log Out</a>
      </div>

    </div>

    <!-- Shown when no user data found -->
    <div class="profile-card not-logged-in" id="not-logged-in" style="display:none;">
      <h2>No account found</h2>
      <p>Create an account or log in to see your profile.</p>
      <a href="create.html" class="btn-menu" style="display:inline-block; padding:12px 28px; background:#8b5a2b; color:white; border-radius:10px; text-decoration:none; font-weight:500;">Create Account</a>
    </div>

  </div>

  <script>
    const raw = localStorage.getItem('maestroUser');

    if (raw) {
      const user = JSON.parse(raw);

      // Build initials from name
      const initials = user.name
        .split(' ')
        .map(w => w[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();

      document.getElementById('avatar-initials').textContent = initials;
      document.getElementById('display-name').textContent    = user.name;
      document.getElementById('display-joined').textContent  = `Member since ${user.joinedAt}`;
      document.getElementById('info-name').textContent       = user.name;
      document.getElementById('info-email').textContent      = user.email;
      document.getElementById('info-joined').textContent     = user.joinedAt;

      document.getElementById('profile-card').style.display = 'block';
    } else {
      document.getElementById('not-logged-in').style.display = 'block';
    }

    // Logout — clears user data and redirects
    document.getElementById('logout-btn')?.addEventListener('click', function (e) {
      e.preventDefault();
      if (confirm('Log out of Maestro?')) {
        localStorage.removeItem('maestroUser');
        window.location.href = 'login.html';
      }
    });
  </script>

</body>
</html>
