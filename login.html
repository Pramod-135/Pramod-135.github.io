<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maestro - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="full-screen-background">

    <div class="centered-box">

      <div class="welcome-heading">
        <h2>Welcome to</h2>
        <h1>Maestro</h1>
      </div>

      <p class="small-info">Skip to <a href="menu.html">Menu Page</a></p>

      <form>
        <div class="field-group">
          <label for="user-id">Username or Email</label>
          <input type="email" id="user-id" placeholder="example@gmail.com" required>
        </div>

        <div class="field-group">
          <label for="pass">Password</label>
          <input type="password" id="pass" placeholder="••••••••" required>
        </div>

        <button type="submit" class="main-button">Login</button>

        <p class="extra-text">
          <a href="create.html">Create account</a>
        </p>
      </form>

    </div>

  </div>

</body>
</html>
